# Hugo reads HUGO_PARAMS_* as site parameters. Plain Hugo builds keep original URLs.
[build]
command = "python -m pip install -r scripts/requirements-build.txt && python scripts/hugo.py --gc --minify --cleanDestinationDir"
publish = "public"

[build.environment]
HUGO_VERSION = "0.169.0"
HUGO_PARAMS_NETLIFYIMAGECDN = "true"

# Exact archive paths only; individual /discipleship-guide/<slug>/ pages stay intact.
[[redirects]]
from = "/discipleship-guide"
to = "/discipleship-guides/"
status = 301
force = true

