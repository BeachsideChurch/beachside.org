backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "static/images/messages"
public_folder: "/images/messages"

collections:
  - name: "watch_live"
    label: "Watch Live"
    files:
      - file: "content/watch-live.md"
        name: "watch_live"
        label: "Watch Live Page"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { name: "layout", widget: "hidden", default: "landing" }
          - label: "YouTube Live URL"
            name: "youtube_live_url"
            widget: "string"
            hint: "Paste the video's HTTPS YouTube watch, live, embed, or youtu.be link. The site creates the privacy-enhanced embed automatically."
            # Keep this in sync with youtube-live-video.html.
            pattern:
              - '^\s*https://(?:(?:www\.)?youtube\.com/(?:watch\?(?:[^#&\s]*&)*v=|(?:live|embed)/)|(?:www\.)?youtube-nocookie\.com/embed/|youtu\.be/)([A-Za-z0-9_-]{11})(?:[?&#][^\s]*)?\s*$'
              - "Enter a YouTube video URL, such as https://www.youtube.com/watch?v=waa1ouN5Aao or https://youtu.be/waa1ouN5Aao. Channel links are not supported."

  - name: "landing_pages"
    label: "Landing Pages"
    label_singular: "Landing Page"
    description: "Standalone pages with independent designs. Published pages are accessible by URL but excluded from site listings. Custom designs and bundled CSS/JS are edited in the repository."
    folder: "content/landing-pages"
    filter: { field: "landing_page", value: true }
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { name: "landing_page", widget: "hidden", default: true }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Public URL", name: "url", widget: "string", required: false, pattern: ['^/[a-z0-9]+(?:[/-][a-z0-9]+)*/$', 'Use a path such as /vrleaders/ with a trailing slash.'], hint: "Optional: /vrleaders/. Leave empty for /landing-pages/page-slug/. Choose an unused URL; existing pages must not share it." }
      - { label: "Custom layout", name: "layout", widget: "string", required: false, hint: "Leave blank for the starter. A developer can add a matching template under layouts/landing-pages/." }
      - { label: "Hide from search engines", name: "noindex", widget: "boolean", default: true, hint: "Requests no indexing. This does not make the page private or password-protected." }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Content", name: "body", widget: "markdown", required: false }

  - name: "message_series"
    label: "Series (Part 1)"
    label_singular: "Series"
    description: "Create a series here first. Publishing creates its folder and Part 1 page. Add later parts under Messages by Series."
    folder: "content/messages"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/_index"
    filter: { field: "layout", value: "series" }
    # A path template otherwise makes media default to the entry's folder.
    media_folder: "/static/images/messages"
    public_folder: "/images/messages"
    fields:
      - { label: "Series title", name: "title", widget: "string" }
      - { label: "Part 1 date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Latest part date", name: "lastmod", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Update this when adding a later part. Keep the Part 1 date unchanged." }
      - { name: "layout", widget: "hidden", default: "series" }
      - { label: "Speaker", name: "speaker", widget: "string" }
      - { label: "Series name", name: "series", widget: "string", hint: "Use the same name as the series title, and copy it to each later part." }
      - { name: "part_number", widget: "hidden", default: 1 }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Part 1 video URL", name: "video_url", widget: "string", required: false }
      - { label: "Audio URL", name: "audio_url", widget: "string", required: false }
      - { label: "Guide URL", name: "guide_url", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "messages"
    label: "Messages by Series"
    label_singular: "Message"
    description: "Select a series folder to edit or add a message. Create new series in Series (Part 1). The root contains standalone messages and the Watch Messages archive page."
    folder: "content/messages"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    nested:
      depth: 2
      subfolders: false
    meta:
      path:
        widget: "string"
        label: "Series folder"
        required: false
        hint: "Selected automatically when creating inside a series. Keep existing folder names unchanged. Use / for a standalone message."
        # No index_file: later parts must keep their individual Markdown filenames.
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Required for messages; leave empty on the Watch Messages archive page." }
      - { label: "Speaker", name: "speaker", widget: "string", required: false }
      - { label: "Series", name: "series", widget: "string", required: false, hint: "Match the Series name on the Part 1 page." }
      - { label: "Part Number", name: "part_number", widget: "number", value_type: "int", min: 1, required: false, hint: "Use 2, 3, etc. for later parts. Leave empty for standalone messages." }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Video URL", name: "video_url", widget: "string", required: false }
      - { label: "Audio URL", name: "audio_url", widget: "string", required: false }
      - { label: "Guide URL", name: "guide_url", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "redirects"
    label: "Redirects"
    files:
      - file: "netlify.toml"
        name: "redirects"
        label: "Redirects"
        format: "toml"
        fields:
          - label: "Redirect rules"
            name: "redirects"
            widget: "list"
            summary: "{{fields.from}} → {{fields.to}}"
            fields:
              - { label: "From", name: "from", widget: "string" }
              - { label: "To", name: "to", widget: "string" }
              - { label: "Status", name: "status", widget: "number", valueType: "int", default: 301 }
              - { label: "Force", name: "force", widget: "boolean", default: true }

  - name: "announcement"
    label: "Announcement Banner"
    files:
      - file: "data/announcement.yaml"
        name: "announcement"
        label: "Announcement Banner"
        format: "yaml"
        fields:
          - { label: "Enabled", name: "enabled", widget: "boolean", default: false }
          - { label: "Text", name: "text", widget: "string" }
          - { label: "Destination URL", name: "url", widget: "string", hint: "Use a site path such as /visit/ or a complete https:// URL." }
          - { label: "Link label", name: "linkText", widget: "string" }

  - name: discipleship_guides
    label: Discipleship Guides
    label_singular: Discipleship Guide
    folder: content/discipleship-guide
    create: true
    slug: '{{slug}}'
    filter:
      field: guide_format
      value: structured
    description: Create and edit guides. Optional sections can be left empty; list items
      can be added, removed, and reordered.
    fields:
    - label: Guide format
      name: guide_format
      widget: hidden
      default: structured
    - label: Title
      name: title
      widget: string
    - label: Date
      name: date
      widget: datetime
      format: YYYY-MM-DDTHH:mm:ssZ
      date_format: YYYY-MM-DD
      time_format: HH:mm
    - label: Speaker
      name: speaker
      widget: string
      required: false
    - label: Series
      name: series
      widget: string
      required: false
    - label: Show series in title panel
      name: display_series
      widget: boolean
      default: false
      required: false
      hint: Show the series name above the guide title. Leave off to hide it in the title panel.
    - label: Description
      name: description
      widget: text
    - label: Draft
      name: draft
      widget: boolean
      default: true
    - label: Message video URL
      name: video_url
      widget: string
      required: false
      hint: YouTube watch, share, or embed URL.
    - label: Message Recap
      name: message_recap
      widget: collapsible-markdown
      required: false
    - label: Main Idea
      name: main_idea
      widget: collapsible-markdown
      required: false
    - label: Group Discussion Questions
      name: discussion_questions
      widget: list
      required: false
      collapsed: true
      minimize_collapsed: true
      fields:
      - label: Question
        name: question
        widget: markdown
      - label: Scripture
        name: question_scripture
        widget: markdown
        required: false
    - label: Daily Devotions
      name: daily_devotions
      widget: list
      required: false
      collapsed: true
      minimize_collapsed: true
      fields:
      - label: Day
        name: day
        widget: string
      - label: Scripture reference
        name: scripture
        widget: string
        required: false
      - label: Scripture URL
        name: scripture_url
        widget: string
        required: false
      - label: Reflection
        name: reflection
        widget: markdown
        required: false
      default:
      - day: Monday
      - day: Tuesday
      - day: Wednesday
      - day: Thursday
      - day: Friday
    - label: Spiritual Practice
      name: spiritual_practice
      widget: collapsible-markdown
      required: false
    - label: Prayer Prompts
      name: prayer_prompts
      widget: list
      required: false
      collapsed: true
      minimize_collapsed: true
      fields:
      - label: Prompt
        name: prompt
        widget: markdown
    - label: Next Steps
      name: next_steps
      widget: list
      required: false
      collapsed: true
      minimize_collapsed: true
      fields:
      - label: Step
        name: step
        widget: markdown
    - label: Resources
      name: resources
      widget: list
      required: false
      collapsed: true
      minimize_collapsed: true
      fields:
      - label: Resource name
        name: title
        widget: string
      - label: URL
        name: url
        widget: string
        required: false
      - label: Description
        name: description
        widget: markdown
        required: false
    - label: Additional content
      name: body
      widget: collapsible-markdown
      required: false

  # Shared field anchors keep the page editors consistent.
  - name: homepage
    label: Homepage
    files:
      - file: data/home.yaml
        name: homepage
        label: Homepage content
        format: yaml
        fields:
          - label: Hero
            name: hero
            widget: object
            required: true
            fields:
              - {label: Title, name: title, widget: string, required: true}
              - {label: Description, name: description, widget: text, required: true}
              - {label: Image, name: image, widget: image, required: true}
              - label: Button
                name: button
                widget: object
                required: true
                fields:
                  - {label: Label, name: label, widget: string, required: true}
                  - {label: Url, name: url, widget: string, required: true}
                collapsed: true
              - label: Live
                name: live
                widget: object
                required: true
                fields:
                  - {label: Label, name: label, widget: string, required: true}
                  - {label: Url, name: url, widget: string, required: true}
                  - {label: Time zone, name: time_zone, widget: string, required: true, hint: 'Use an IANA
                      time zone, such as America/Chicago.'}
                  - label: Windows
                    name: windows
                    widget: list
                    required: true
                    fields:
                      - {label: Start, name: start, widget: string, required: true, pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$',
                          'Use 24-hour HH:MM, such as 08:45.']}
                      - {label: End, name: end, widget: string, required: true, pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$',
                          'Use 24-hour HH:MM, such as 08:45.']}
                    collapsed: true
                    summary: '{{fields.start}}–{{fields.end}}'
                    hint: Sunday live-button windows, in the configured time zone. Use 24-hour HH:MM times.
                collapsed: true
              - label: Secondary
                name: secondary
                widget: object
                required: true
                fields:
                  - {label: Label, name: label, widget: string, required: true}
                  - {label: Url, name: url, widget: string, required: true}
                collapsed: true
              - {label: Schedule, name: schedule, widget: string, required: true}
              - {label: Address, name: address, widget: string, required: true}
            collapsed: true
          - label: Navigation
            name: navigation
            widget: list
            required: true
            fields:
              - {label: Label, name: label, widget: string, required: true}
              - {label: Url, name: url, widget: string, required: true}
            collapsed: true
            summary: '{{fields.label}}'
          - label: Sunday
            name: sunday
            widget: object
            required: true
            fields:
              - {label: Heading, name: heading, widget: string, required: true}
              - label: Times
                name: times
                widget: list
                required: true
                field: {label: Value, name: value, widget: string, required: true}
              - {label: Address, name: address, widget: string, required: true}
              - {label: Landmark, name: landmark, widget: string, required: true}
              - {label: Image, name: image, widget: image, required: true}
              - {label: Image alt, name: image_alt, widget: string, required: true}
            collapsed: true
          - label: Welcome
            name: welcome
            widget: object
            required: true
            fields:
              - {label: Heading, name: heading, widget: string, required: true}
              - label: Cards
                name: cards
                widget: list
                required: true
                fields:
                  - {label: Title, name: title, widget: string, required: true}
                  - {label: Description, name: description, widget: text, required: true}
                  - {label: Image, name: image, widget: image, required: true}
                collapsed: true
                summary: '{{fields.title}}'
            collapsed: true
          - label: Community
            name: community
            widget: object
            required: true
            fields:
              - {label: Heading, name: heading, widget: string, required: true}
              - {label: Description, name: description, widget: text, required: true}
              - label: Cards
                name: cards
                widget: list
                required: true
                fields:
                  - {label: Title, name: title, widget: string, required: true}
                  - {label: Description, name: description, widget: text, required: true}
                  - {label: Label, name: label, widget: string, required: true}
                  - {label: Url, name: url, widget: string, required: true}
                collapsed: true
                summary: '{{fields.title}}'
            collapsed: true
          - label: Families
            name: families
            widget: object
            required: true
            fields:
              - {label: Eyebrow, name: eyebrow, widget: string, required: true}
              - {label: Heading, name: heading, widget: string, required: true}
              - label: Cards
                name: cards
                widget: list
                required: true
                fields:
                  - {label: Title, name: title, widget: string, required: true}
                  - {label: Age, name: age, widget: string, required: true}
                  - {label: Image, name: image, widget: image, required: true}
                  - {label: Url, name: url, widget: string, required: true}
                collapsed: true
                summary: '{{fields.title}}'
            collapsed: true
          - label: Messages
            name: messages
            widget: object
            required: true
            fields:
              - {label: Description, name: description, widget: text, required: true}
            collapsed: true
          - {label: Mission, name: mission, widget: text, required: true}
          - label: Connect
            name: connect
            widget: list
            required: true
            fields:
              - {label: Title, name: title, widget: string, required: true}
              - {label: Description, name: description, widget: text, required: true}
              - {label: Label, name: label, widget: string, required: true}
              - {label: Url, name: url, widget: string, required: true}
              - {label: Open in a new tab, name: external, widget: boolean, required: false, default: false}
            collapsed: true
            summary: '{{fields.title}}'
      - file: content/_index.md
        name: home_metadata
        label: Homepage title and search description
        fields:
          - {label: Title, name: title, widget: string, required: true}
          - {label: Description, name: description, widget: text, required: true}
    media_folder: /static/images/home
    public_folder: /images/home
  - name: site_pages
    label: Site Pages
    description: Edit existing pages, their images, buttons, cards, and text sections.
    files:
      - file: content/about/_index.md
        name: content_about__index
        label: About Us
        fields: &site_page_fields
          - {label: Title, name: title, widget: string, required: true}
          - {label: Description, name: description, widget: text, required: true}
          - {label: Subtitle, name: subtitle, widget: string, required: false}
          - {label: Previous URLs, name: aliases, widget: list, required: false, hint: Keep existing aliases
              so old links continue to work.}
          - {label: Draft, name: draft, widget: boolean, required: false, default: false}
          - {label: Layout, name: layout, widget: hidden, required: false, default: landing}
          - {label: Use the hero as the page heading, name: hide_page_header, widget: boolean, required: false,
            default: false}
          - {label: Overlay navigation on the hero, name: header_overlay, widget: boolean, required: false,
            default: false}
          - label: Hero
            name: hero
            widget: object
            required: false
            fields:
              - {label: Image, name: image, widget: image, required: true}
              - {label: Title, name: title, widget: string, required: false}
              - {label: Description, name: description, widget: text, required: false}
              - {label: Eyebrow, name: eyebrow, widget: string, required: false}
              - {label: Image focal point, name: position, widget: string, required: false, hint: 'For example:
                  center or center 42%.'}
              - {label: Height, name: height, widget: string, required: false, hint: 'For example: 58vh.
                  Leave empty for the default height.'}
              - {label: Compact, name: compact, widget: boolean, required: false, default: false}
              - {label: Center the text, name: center, widget: boolean, required: false, default: false}
              - label: Button
                name: button
                widget: object
                required: false
                fields:
                  - {label: Label, name: label, widget: string, required: true}
                  - {label: Url, name: url, widget: string, required: true, hint: 'Use a site path such
                      as /visit/, or a complete https:// URL.'}
                  - {label: Open in a new tab, name: external, widget: boolean, required: false, default: false}
                collapsed: true
            collapsed: true
          - label: Page sections
            name: sections
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.title}}'
            typeKey: kind
            types:
              - label: Text
                name: text
                widget: object
                fields:
                  - {label: Title, name: title, widget: string, required: false}
                  - {label: Theme, name: theme, widget: select, required: false, options: [light, dark,
                      teal]}
                  - {label: Body, name: body, widget: markdown, required: false}
                  - label: Button
                    name: button
                    widget: object
                    required: false
                    fields:
                      - {label: Label, name: label, widget: string, required: true}
                      - {label: Url, name: url, widget: string, required: true, hint: 'Use a site path such
                          as /visit/, or a complete https:// URL.'}
                      - {label: Open in a new tab, name: external, widget: boolean, required: false, default: false}
                    collapsed: true
              - label: Image and text
                name: split
                widget: object
                fields:
                  - {label: Title, name: title, widget: string, required: false}
                  - {label: Theme, name: theme, widget: select, required: false, options: [light, dark,
                      teal]}
                  - {label: Body, name: body, widget: markdown, required: false}
                  - {label: Eyebrow, name: eyebrow, widget: string, required: false}
                  - {label: Image, name: image, widget: image, required: true}
                  - {label: Image description, name: image_alt, widget: string, required: false}
                  - {label: Image side, name: image_side, widget: select, required: false, options: [left,
                      right], default: left}
                  - label: Button
                    name: button
                    widget: object
                    required: false
                    fields:
                      - {label: Label, name: label, widget: string, required: true}
                      - {label: Url, name: url, widget: string, required: true, hint: 'Use a site path such
                          as /visit/, or a complete https:// URL.'}
                      - {label: Open in a new tab, name: external, widget: boolean, required: false, default: false}
                    collapsed: true
              - label: Cards
                name: cards
                widget: object
                fields:
                  - {label: Title, name: title, widget: string, required: false}
                  - {label: Theme, name: theme, widget: select, required: false, options: [light, dark,
                      teal]}
                  - {label: Body, name: body, widget: markdown, required: false}
                  - {label: Cards per row, name: columns, widget: number, required: false, value_type: int,
                    min: 1, max: 4, default: 3}
                  - label: Cards
                    name: cards
                    widget: list
                    required: false
                    fields:
                      - {label: Title, name: title, widget: string, required: true}
                      - {label: Description, name: description, widget: markdown, required: false}
                      - {label: Image, name: image, widget: image, required: false}
                      - {label: Url, name: url, widget: string, required: false}
                      - {label: Link label, name: link_label, widget: string, required: false}
                      - {label: Open in a new tab, name: external, widget: boolean, required: false, default: false}
                    collapsed: true
                    summary: '{{fields.title}}'
              - label: Text columns
                name: columns
                widget: object
                fields:
                  - {label: Title, name: title, widget: string, required: false}
                  - {label: Theme, name: theme, widget: select, required: false, options: [light, dark,
                      teal]}
                  - label: Columns
                    name: columns
                    widget: list
                    required: false
                    fields:
                      - {label: Title, name: title, widget: string, required: false}
                      - {label: Body, name: body, widget: markdown, required: false}
                    collapsed: true
                    summary: '{{fields.title}}'
          - {label: Additional page content, name: body, widget: markdown, required: false}
      - file: content/about/faq.md
        name: content_about_faq
        label: FAQ
        fields: *site_page_fields
      - file: content/about/our-story.md
        name: content_about_our-story
        label: Our Story
        fields: *site_page_fields
      - file: content/adults/_index.md
        name: content_adults__index
        label: Adults & Groups
        fields: *site_page_fields
      - file: content/adults/groups/childcare-supplement.md
        name: content_adults_groups_childcare-supplement
        label: Childcare Supplement
        fields: *site_page_fields
      - file: content/adults/groups.md
        name: content_adults_groups
        label: Groups
        fields: *site_page_fields
      - file: content/adults/starting-point.md
        name: content_adults_starting-point
        label: Starting Point
        fields: *site_page_fields
      - file: content/baptism-new.md
        name: content_baptism-new
        label: Baptism
        fields: *site_page_fields
      - file: content/children/_index.md
        name: content_children__index
        label: Kids at Beachside
        fields: *site_page_fields
      - file: content/children/partnering-with-parents.md
        name: content_children_partnering-with-parents
        label: Partnering with Parents
        fields: *site_page_fields
      - file: content/contact.md
        name: content_contact
        label: Contact Us
        fields: *site_page_fields
      - file: content/engage/give.md
        name: content_engage_give
        label: Give
        fields: *site_page_fields
      - file: content/engage/serve/_index.md
        name: content_engage_serve__index
        label: Serve
        fields: *site_page_fields
      - file: content/engage/serve/community.md
        name: content_engage_serve_community
        label: Serve in the Community
        fields: *site_page_fields
      - file: content/engage/serve/in-the-world.md
        name: content_engage_serve_in-the-world
        label: Serve in the World
        fields: *site_page_fields
      - file: content/engage/serve/volunteer.md
        name: content_engage_serve_volunteer
        label: Serve at Beachside
        fields: *site_page_fields
      - file: content/for.md
        name: content_for
        label: For the Emerald Coast
        fields: *site_page_fields
