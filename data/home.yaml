# Homepage content for the redesign. Images and links can be replaced here.
hero:
  title: We help make faith practical.
  description: >-
    A church for families who want a great place for their kids, real friends, and a faith that makes sense
    for everyday life.
  image: /images/home/redesign-hero.jpg
  button:
    label: Plan Your Visit
    url: /visit/
  live:
    label: Watch live now!
    url: /watch-live/
    time_zone: America/Chicago
    # Provisional window covering both services; the legacy schedule is not public.
    windows:
      - start: "08:45"
        end: "12:00"
  secondary:
    label: Get Directions
    url: /times-directions/
  schedule: Sundays at 9:00am and 10:45am
  address: 200 Racetrack Road NW, Fort Walton Beach

navigation:
  - label: Events
    url: /events/
  - label: FOR
    url: /for/
  - label: Watch
    url: /messages/
  - label: Give
    url: /engage/give/

sunday:
  heading: Join us Sunday
  times: ["9:00", "10:45"]
  address: 200 Racetrack Rd NW, FWB, FL 32547
  landmark: Next to Choctaw High School
  image: /images/home/redesign-location.jpg
  image_alt: Beachside Church in Fort Walton Beach

welcome:
  heading: Your first Sunday, minus the guesswork.
  cards:
    - title: Come as you are
      description: No matter where you are, you can belong here before you believe.
      image: /images/home/join-sunday.jpg
    - title: Kids are covered
      description: Safe, secure check-in and a morning your kids will ask to come back to.
      image: /images/pages/waumba-hero.jpeg
    - title: About an hour
      description: Music, a message you can actually use this week, and you're out.
      image: /images/home/adult-sunday.jpg

community:
  heading: Life is complicated. You want to get it right. We want to help.
  description: >-
    Beachside is full of locals, military families, and people who are new to the Emerald Coast. We're here to
    help you discover a practical faith that leads to greater meaning and direction in life. We've built every
    Sunday with guests in mind, so you'll know where to go, what to expect, and who to ask.
  # Replace these welcome cards with approved testimonials when available.
  cards:
    - title: A place to belong.
      description: Real friends make a difference. Find a group and experience why life is better connected.
      label: Find your people
      url: /adults/groups/
    - title: Room for your questions.
      description: Exploring faith? Starting Point is a conversation about faith where your questions are welcome.
      label: Explore Starting Point
      url: /adults/starting-point/

families:
  eyebrow: Family ministry
  heading: Something great for every age.
  cards:
    - title: Waumba Land
      age: Birth–Preschool
      image: /images/pages/waumba-hero.jpeg
      url: /children/waumba-land/
    - title: UpStreet
      age: Elementary school
      image: /images/pages/upstreet-hero.jpg
      url: /children/upstreet/
    - title: Transit
      age: Middle school
      image: /images/pages/transit-hero.jpg
      url: /students/transit/
    - title: InsideOut
      age: High school
      image: /images/pages/insideout-hero.jpeg
      url: /students/insideout/

messages:
  description: Missed Sunday, or want to catch up before you visit? Every message is online, free, no signup.

mission: >-
  Our mission is to inspire people to follow Jesus with all of their heart. Because what we've found is that
  following Jesus makes life better and makes us better at life.

