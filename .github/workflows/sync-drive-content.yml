name: Sync Google Drive content

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without committing
        type: boolean
        default: true
      folder_id:
        description: Optional single weekly folder ID (otherwise use configured parent)
        type: string
        required: false
      all_folders:
        description: Include folders older than seven days (backfills or corrections)
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: sync-drive-content
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.DRIVE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sync dependencies
        run: python -m pip install -r scripts/requirements-drive-sync.txt
      - name: Test content routing
        run: python scripts/test_sync_drive_content.py
      - name: Read and validate Drive content
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ inputs.folder_id || secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ALL_FOLDERS: ${{ github.event_name == 'workflow_dispatch' && inputs.all_folders }}
        run: |
          args=()
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          if [ "$ALL_FOLDERS" = 'true' ]; then args+=(--all-folders); fi
          python scripts/sync_drive_content.py "${args[@]}"
      - name: Commit synced content
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: |
          git add -- content/messages content/discipleship-guide static/images/messages
          if git diff --cached --quiet; then
            echo 'No content changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync message content from Google Drive'
          git push origin HEAD:"$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
